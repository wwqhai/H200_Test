[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h200-test-system"
version = "0.1.0"
description = "H200 AI Cluster Testing and Validation System"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "H200 Project", email = "h200@example.com"}]

dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "sqlalchemy>=2.0.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.16.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.scripts]
h200-test = "h200_test.cli:main"

[tool.setuptools]
packages = ["h200_test"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
